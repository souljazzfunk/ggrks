{{ define "main" }}
{{ with .Content }}<div class="intro">{{ . }}</div>{{ end }}
<ul class="post-list">
{{ range (where .Site.RegularPages "Section" "posts").ByDate.Reverse }}
<li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time> <a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
{{ end }}
</ul>
{{ end }}
