{{ define "main" }}
<h1>{{ .Title }}</h1>
<ul class="post-list">
{{ range .Pages.ByDate.Reverse }}
{{ $page := . }}
<li class="post-card">
{{ with .Params.image }}
<a class="thumb" href="{{ $page.RelPermalink }}"><img src="{{ . | relURL }}" alt=""></a>
{{ end }}
<div class="card-text">
<time>{{ $page.Date.Format "2006-01-02" }}</time>
<a href="{{ $page.RelPermalink }}">{{ $page.Title }}</a>
</div>
</li>
{{ end }}
</ul>
{{ end }}
