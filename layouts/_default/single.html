{{ define "main" }}
<article>
<h1>{{ .Title }}</h1>
<p class="meta">
{{ with .Date }}{{ if not .IsZero }}<time datetime="{{ .Format "2006-01-02T15:04:05" }}">{{ .Format "2006-01-02 15:04" }}</time>{{ end }}{{ end }}
{{ with .Params.categories }} · {{ delimit . ", " }}{{ end }}
</p>
{{ with .Params.image }}
<figure class="eyecatch">
<img src="{{ . | relURL }}" alt="{{ $.Title }}">
</figure>
{{ end }}
<div class="body">
{{ .Content }}
</div>
</article>
{{ end }}
